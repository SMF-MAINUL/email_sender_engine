<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AIH Email Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #2BD5E3; }
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-primary { background-color: var(--primary-color); border: none; }
    </style>
</head>
<body class="py-5">

<div class="container">
    <div class="card p-5">
        {% if not columns %}
        <div class="text-center">
            <i class="fas fa-file-csv fa-4x text-info mb-3"></i>
            <h3 class="fw-bold">Upload CSV Client List</h3>
            <form method="post" enctype="multipart/form-data" class="mt-4">
                <input type="file" name="file" class="form-control mb-3" required>
                <button type="submit" class="btn btn-primary btn-lg w-100">Upload & Preview Data</button>
            </form>
        </div>
        {% else %}
        <h5 class="fw-bold mb-3"><i class="fas fa-table me-2"></i> CSV Preview</h5>
        <div class="table-responsive mb-4 border rounded">{{ preview_rows|safe }}</div>

        <div class="row bg-light p-3 rounded g-3 align-items-end">
            <div class="col-md-8">
                <label class="form-label fw-bold">Select Email Column:</label>
                <select id="email_col" class="form-select form-select-lg">
                    <option value="" disabled selected>Choose column...</option>
                    {% for col in columns %}
                    <option value="{{ col }}">{{ col }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <button onclick="generateList()" class="btn btn-dark btn-lg w-100"><i class="fas fa-sync me-2"></i> Generate Send List</button>
            </div>
        </div>

        <div id="list_section" class="mt-4" style="display:none;">
            <div id="stats" class="badge bg-primary mb-2 p-2"></div>
            <div style="max-height: 300px; overflow-y: auto;" class="border rounded bg-white">
                <table class="table table-sm mb-0">
                    <thead class="table-light"><tr><th>SL</th><th>Email</th></tr></thead>
                    <tbody id="email_tbody"></tbody>
                </table>
            </div>
            <form action="/send" method="post" class="mt-4 text-center">
                <input type="hidden" name="filename" value="{{ filename }}">
                <input type="hidden" name="selected_col" id="selected_col_input">
                <button type="submit" class="btn btn-primary btn-xl py-3 px-5 shadow">Start Sending</button>
            </form>
        </div>
        {% endif %}
    </div>
</div>

<script>
function generateList() {
    const col = document.getElementById('email_col').value;
    if(!col) return;
    const formData = new FormData();
    formData.append('filename', "{{ filename }}");
    formData.append('email_col', col);

    fetch('/get_emails', { method: 'POST', body: formData })
    .then(res => res.json())
    .then(data => {
        const tbody = document.getElementById('email_tbody');
        tbody.innerHTML = "";
        document.getElementById('list_section').style.display = "block";
        document.getElementById('selected_col_input').value = col;
        document.getElementById('stats').innerText = `New: ${data.emails.length} | Already Sent: ${data.skipped}`;
        data.emails.forEach((email, index) => {
            tbody.innerHTML += `<tr><td>${index + 1}</td><td>${email}</td></tr>`;
        });
    });
}
</script>
</body>
</html>
